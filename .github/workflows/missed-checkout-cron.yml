# =============================================================================
# Missed-checkout sweep, on a 15-minute cadence.
#
# Why this exists instead of a Vercel cron: Vercel's Hobby plan only allows
# daily cron invocations, so the equivalent entry in vercel.json could only
# run once a day (see src/app/api/jobs/missed-checkout/route.ts) — spec 4.4
# asks for an alert "if check-out has not occurred 30 minutes after shift
# end", not a next-day digest. GitHub Actions has no such limit and is free,
# so this workflow is the one actually driving that requirement; the old
# once-daily Vercel cron entry for this route has been removed from
# vercel.json to avoid confusion about which trigger is authoritative.
#
# The endpoint is idempotent (skips shifts that already got a
# `missed_checkout:<shift_id>` notification), so overlapping runs are safe.
#
# Required GitHub secrets:
#   APP_URL      — the deployed app's origin, e.g. https://app.priyas.de
#                  (no trailing slash).
#   CRON_SECRET  — same value as the Vercel project's CRON_SECRET env var;
#                  the route checks this via a Bearer token either way.
#
# Manual trigger:
#   GitHub UI → Actions → "Missed checkout sweep" → "Run workflow".
# =============================================================================
name: Missed checkout sweep

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch:

concurrency:
  group: missed-checkout-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call missed-checkout endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and/or CRON_SECRET repo secrets are not set."
            exit 1
          fi
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$APP_URL/api/jobs/missed-checkout" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat /tmp/response.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "::error::missed-checkout endpoint returned HTTP $status"
            exit 1
          fi
