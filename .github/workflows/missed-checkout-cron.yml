# =============================================================================
# Missed-checkout sweep, on a 15-minute cadence.
#
# Why this exists instead of a Vercel cron: Vercel's Hobby plan only allows
# daily cron invocations, so the equivalent entry in vercel.json could only
# run once a day (see src/app/api/jobs/missed-checkout/route.ts) — spec 4.4
# asks for an alert "if check-out has not occurred 30 minutes after shift
# end", not a next-day digest. GitHub Actions has no such limit and is free,
# so this workflow is the one actually driving that requirement; the old
# once-daily Vercel cron entry for this route has been removed from
# vercel.json to avoid confusion about which trigger is authoritative.
#
# The endpoint is idempotent (skips shifts that already got a
# `missed_checkout:<shift_id>` notification), so overlapping runs are safe.
#
# ── Re-enabling the schedule ─────────────────────────────────────────────
# The auto-schedule is currently OFF because the deployed URL + shared
# secret are not yet configured in this repo — running it that way just
# emails a failure every 15 minutes. To turn it back on:
#
#   1. Add repo secrets under Settings → Secrets and variables → Actions:
#        APP_URL      — deployed origin, e.g. https://app.priyas.de
#                       (no trailing slash)
#        CRON_SECRET  — same value as the Vercel project's CRON_SECRET
#                       env var; the route checks this via Bearer token
#   2. Uncomment the `schedule:` block below.
#   3. Verify with one manual dispatch from Actions → "Missed checkout
#      sweep" → "Run workflow" before letting the cron take over.
#
# Manual dispatch keeps working with or without the auto-schedule.
# =============================================================================
name: Missed checkout sweep

on:
  # schedule:
  #   - cron: "*/15 * * * *" # every 15 minutes — re-enable when APP_URL + CRON_SECRET are set
  workflow_dispatch:

concurrency:
  group: missed-checkout-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call missed-checkout endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipping sweep — APP_URL and/or CRON_SECRET repo secrets are not set. See the workflow file header for setup instructions."
            exit 0
          fi
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$APP_URL/api/jobs/missed-checkout" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat /tmp/response.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "::error::missed-checkout endpoint returned HTTP $status"
            exit 1
          fi
